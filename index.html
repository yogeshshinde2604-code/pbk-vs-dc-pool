.boundary-effect{position:fixed;inset:0;pointer-events:none;z-index:600}
.boundary-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:900;color:#ffd600;text-shadow:0 0 40px rgba(255,214,0,1);animation:boundaryZoom 1s ease}

.confetti{position:fixed;width:10px;height:10px;background:#ffd600;top:-10px;animation:confettiFall 3s linear;z-index:700}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}

</style>
</head>

function switchTab(tab,el){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});
  document.querySelectorAll("#poolsTab,#dashboardTab,#liveTab,#adminTab").forEach(function(t){t.classList.add("hidden")});
  if(el) el.classList.add("active");
  document.getElementById(tab+"Tab").classList.remove("hidden");
  if(tab==='dashboard') updateDashboard();
}

  document.getElementById('totalMatches').textContent = stats.bets;
  updateLeaderboard();
}
