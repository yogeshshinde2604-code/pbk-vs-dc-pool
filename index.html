<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DC vs PBKS MULTIPLAYER 2026</title><style>@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;900&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:'Rajdhani',sans-serif}.app{max-width:480px;margin:0 auto;min-height:100vh}.hidden{display:none!important}button,input{font-family:'Rajdhani',sans-serif;border:none;outline:none;cursor:pointer}.login-box{background:rgba(0,245,255,0.08);padding:30px 20px;border-radius:25px;border:2px solid #00f5ff;text-align:center;margin:40px 20px}h1{font-size:28px;margin-bottom:15px;background:linear-gradient(90deg,#ff1744,#448aff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn{width:100%;padding:18px;margin:10px 0;border-radius:15px;font-weight:900;font-size:16px}.host{background:linear-gradient(135deg,#ff1744,#ff9800);color:#fff}.join{background:linear-gradient(135deg,#00f5ff,#00ff88);color:#000}input{width:100%;padding:16px;margin:10px 0;border-radius:15px;background:rgba(0,0,0,0.6);color:#fff;border:2px solid #00f5ff;font-size:16px;text-align:center;text-transform:uppercase}.topbar{background:rgba(0,0,0,0.9);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00f5ff;position:sticky;top:0;z-index:100}.room-code{background:#ffd600;color:#000;padding:8px 15px;border-radius:20px;font-weight:900;font-size:18px}.card{background:rgba(0,245,255,0.08);padding:18px;margin:12px 15px;border-radius:18px;border:2px solid #00f5ff}.player-list{max-height:300px;overflow-y:auto}.player-row{display:flex;justify-content:space-between;align-items:center;padding:12px;margin:8px 0;background:rgba(0,0,0,0.5);border-radius:12px;border:2px solid #333}.player-row.me{border-color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,0.5)}.player-row.host{border-color:#ff1744}.player-name{font-weight:700}.player-badge{background:#ff1744;color:#fff;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:900;margin-left:8px}.score-big{font-size:42px;font-weight:900;color:#00ff88;text-align:center;margin:20px 0;text-shadow:0 0 20px rgba(0,255,136,0.8)}.start-btn{background:linear-gradient(135deg,#00ff88,#00f5ff);color:#000;padding:18px;border-radius:15px;width:100%;font-weight:900;font-size:18px;margin:15px 0}.start-btn:disabled{background:#333;color:#666}.leaderboard{display:grid;grid-template-columns:1fr;gap:8px}.lb-row{display:flex;justify-content:space-between;padding:10px;background:linear-gradient(135deg,#1a1f3a,#0a0e27);border-radius:10px;border-left:4px solid #00f5ff}.lb-row.top{border-left-color:#ffd600;background:linear-gradient(135deg,rgba(255,214,0,0.2),rgba(0,0,0,0.5))}.lb-rank{color:#ffd600;font-weight:900;width:30px}.lb-name{flex:1}.lb-score{color:#00ff88;font-weight:900}#toast{position:fixed;bottom:-100px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#00f5ff,#00ff88);color:#000;padding:15px 30px;border-radius:50px;font-weight:900;transition:all 0.5s;z-index:999}#toast.show{bottom:30px}.waiting{text-align:center;color:#ffd600;font-size:14px;margin:20px 0;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}</style></head><body><div class="app" id="app"></div><div id="toast"></div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script>const firebaseConfig={databaseURL:"https://beast-dc-pbks-default-rtdb.asia-southeast1.firebasedatabase.app/"};firebase.initializeApp(firebaseConfig);const db=firebase.database();var user="",roomCode="",isHost=!1,players={},gameStarted=!1;function init(){document.getElementById("app").innerHTML=`<div id="loginScreen"><div class="login-box"><h1>⚡ DC vs PBKS LIVE</h1><div style="background:linear-gradient(135deg,#ff1744,#448aff);padding:20px;margin:15px 0;border-radius:20px;border:3px solid #ffd600"><div style="font-size:24px;font-weight:900">DC: 264/2 🔥 PBKS</div><div style="font-size:12px;margin-top:8px">MULTIPLAYER ROOM</div></div><input type="text" id="nameInput" placeholder="APNA NAAM" maxlength="15"><button class="btn host" onclick="createRoom()">🎮 NAYA ROOM BANAO</button><div style="text-align:center;margin:20px 0;color:#666">YA</div><input type="text" id="roomInput" placeholder="ROOM CODE DALO" maxlength="6"><button class="btn join" onclick="joinRoom()">🚀 ROOM JOIN KARO</button></div></div><div id="lobbyScreen" class="hidden"><div class="topbar"><div>Room: <span class="room-code" id="roomCodeDisplay"></span></div><div id="playerCount">👥 0</div></div><div class="card"><h3 style="text-align:center;color:#00f5ff;margin-bottom:15px">🏆 PRIZE POOL: ₹<span id="prizePool">0</span></h3><div class="player-list" id="playerList"></div><div class="waiting" id="waitingText">Doston ka wait kar rahe hain...</div><button class="start-btn" id="startBtn" onclick="startGame()" disabled>START GAME (Min 2 Players)</button></div></div><div id="gameScreen" class="hidden"><div class="topbar"><div>Room: <span class="room-code" id="roomCodeGame"></span></div><div id="timer">⏱️ 0s</div></div><div class="score-big" id="liveScore">0</div><div class="card"><h3 style="text-align:center;color:#ffd600;margin-bottom:15px">🔴 LIVE LEADERBOARD</h3><div class="leaderboard" id="leaderboard"></div></div></div>`}function showToast(e){var t=document.getElementById("toast");t.textContent=e,t.classList.add("show"),setTimeout(function(){t.classList.remove("show")},3e3)}function createRoom(){var e=document.getElementById("nameInput").value.trim();if(e.length<2)return showToast("Naam daal bhai");user=e,isHost=!0,roomCode="DC"+Math.floor(100+900*Math.random()),db.ref("rooms/"+roomCode).set({host:user,players:{},status:"waiting",prize:0,started:!1}),joinRoomByCode(roomCode)}function joinRoom(){var e=document.getElementById("nameInput").value.trim(),t=document.getElementById("roomInput").value.trim().toUpperCase();if(e.length<2)return showToast("Naam daal bhai");if(t.length<3)return showToast("Room code daal");user=e,joinRoomByCode(t)}function joinRoomByCode(e){roomCode=e,db.ref("rooms/"+roomCode).once("value",function(t){if(!t.exists())return showToast("Room nahi mila");var n=t.val();if(n.started)return showToast("Game shuru ho chuka hai");db.ref("rooms/"+roomCode+"/players/"+user).set({name:user,score:0,isHost:isHost,joined:Date.now()}),showLobby(),listenToRoom()})}function showLobby(){document.getElementById("loginScreen").classList.add("hidden"),document.getElementById("lobbyScreen").classList.remove("hidden"),document.getElementById("roomCodeDisplay").textContent=roomCode}function listenToRoom(){db.ref("rooms/"+roomCode).on("value",function(e){var t=e.val();if(!t)return;players=t.players||{},updateLobby(t),t.started&&!gameStarted&&(gameStarted=!0,showGame())})}function updateLobby(e){var t=Object.keys(players).length;document.getElementById("playerCount").textContent="👥 "+t,document.getElementById("prizePool").textContent=100*t*.77;var n="";Object.values(players).forEach(function(e){var t="player-row";e.name===user&&(t+=" me"),e.isHost&&(t+=" host"),n+=`<div class="${t}"><div><span class="player-name">${e.name}</span>${e.isHost?'<span class="player-badge">HOST</span>':""}</div><div>✅</div></div>`}),document.getElementById("playerList").innerHTML=n;var o=document.getElementById("startBtn");isHost&&(t>=2?(o.disabled=!1,o.textContent=`START GAME (${t} Players)`):(o.disabled=!0,o.textContent="START GAME (Min 2 Players)"))}function startGame(){if(!isHost)return;db.ref("rooms/"+roomCode).update({started:!0,startTime:Date.now()}),Object.keys(players).forEach(function(e){var t=Math.floor(50+200*Math.random());db.ref("rooms/"+roomCode+"/players/"+e+"/score").set(t)})}function showGame(){document.getElementById("lobbyScreen").classList.add("hidden"),document.getElementById("gameScreen").classList.remove("hidden"),document.getElementById("roomCodeGame").textContent=roomCode;var e=0,t=setInterval(function(){e++,document.getElementById("timer").textContent="⏱️ "+e+"s",e>=15&&(clearInterval(t),declareWinner())},1e3);db.ref("rooms/"+roomCode+"/players").on("value",function(e){var t=e.val(),n=Object.values(t).sort(function(e,t){return t.score-e.score});document.getElementById("liveScore").textContent=players[user]?.score||0;var o="";n.forEach(function(e,t){var i="lb-row";0===t&&(i+=" top"),e.name===user&&(i+=" me"),o+=`<div class="${i}"><span class="lb-rank">#${t+1}</span><span class="lb-name">${e.name}</span><span class="lb-score">${e.score}</span></div>`}),document.getElementById("leaderboard").innerHTML=o})}function declareWinner(){db.ref("rooms/"+roomCode+"/players").once("value",function(e){var t=Object.values(e.val()).sort(function(e,t){return t.score-e.score})[0];showToast(t.name===user?"🏆 TU JEET GAYA! ₹"+Math.floor(100*Object.keys(players).length*.77):"Winner: "+t.name)})}init();</script></body></html>
